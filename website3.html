<html>
    <head>
        <style>
            button{
                font-weight:bold;
            }
            .back-button{
            height:30px;
            }
            a{
                margin-left:10px;
                text-decoration:underline;
                color:rgb(130, 15, 130);
            }
            .next-button{
                height:30px;
                margin-left:10px;
            }
            .stretch-button{
                margin-left: 30px;
                background-color: rgb(16, 147, 16);
                border:none;
                height:30px;
                width:80px;
                color:white;
                cursor:pointer;
                transition:transform 1s;
            }
            .stretch-button:hover{
                transform: scale(2);opacity:0.8;
            }
            .shadow-button{
            background-color:rgb(16, 147, 16);
            margin-top:20px;
            border:none;
            height:30px;
            width:80px;
            color:white;
            margin-right:20px
            }
            .shadow-button:hover{
             box-shadow: 3px 3px 5px rgb(106, 99, 99);
            }
            .l{
                margin-left:20px;
            background-color:rgb(16, 147, 16);
            margin-top:20px;
            border:none;
            color:white;
            padding-right: 10px;
            padding-left: 10px;
            padding-top: 5px;
            padding-bottom:5px ;
            transition:transform 0.5s;
            }
            .l:hover{
              transform: scaleX(1.5);
            }
        </style>
    </head>
        <body>
         <button class="back-button">Back</button>
         <a>1 </a>
         <a>2</a>
         <a>3</a>
         <a>4</a>
         <a>5</a>
         <button class="next-button">Next</button>
         <button class="stretch-button">Stretch</button>
         <br>
         <button class="shadow-button">Shadow</button>
         <button class="l">One</button1>
         <button class="l">Two</button1>
         <button class="l">Three</button1>
        </body>
</html>
