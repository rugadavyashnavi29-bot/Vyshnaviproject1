<html>
    <head>
        <style>
.subscribe-button{
    background-color: red;
    color:white;
    border:none;
    border-radius:5px;
    height:35px;
    width:100px;
    margin-right: 5px;
    cursor:pointer;
}
.subscribe-button:hover{
    opacity:0.8;transition:background-color:0.15s,color:0.15s;
}
.subscribe-button:active{
    opacity:0.5;
    transition:background-color 0.15s,color 0.15s;
}
.join-button{
    background-color:white;
    color:rgb(37, 152, 209);
    border-color: rgb(34, 125, 205);
    border-style:solid;
    border-width: 1px;
    border-radius:5px;
    height:35px;
    width:100px;
    cursor:pointer;
    transition:background-color 0.15s,color 0.15s;
}
.join-button:hover{
    background-color: rgb(32, 131, 197);
    color:white;
}
.tweet-button{
        background-color:blue;
    color:white;
    border-color: rgb(34, 125, 205);
    border:none;
    border-width: 1px;
    border-radius:15px;
    margin-left:5px;
    height:35px;
    width:100px;
    cursor:pointer;
    font-size: 16px;
    font-weight: 100px;
}
.tweet-button:hover{
    box-shadow: 10px 10px 10px rgb(99, 93, 93);
    transition:box-shadow 0.15;
}
</style>
</head>
<body>
<button class="subscribe-button">SUBSCRIBE</button>
<button class="join-button">JOIN</button>
<button class="tweet-button">TWEET</button>
</body>
</html>
