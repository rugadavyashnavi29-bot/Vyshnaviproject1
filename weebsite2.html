<html>
    <head>
    <style>
        .request-button{
            color:white;
            background-color: black;
            height: 30px;
            width:100px;
            margin:none;
        }
        .cart-button{
            background-color: rgb(255,216,20);
            border:none;
            margin-left:10px;
            height:30px;
            width:135px;
            border-radius:15px;
        }
        .sign-button{
            background-color: rgb(46,164,79);
            color:white;
            border:none;
            height:30px;
            width:75px;
            border-radius: 4px;
            margin-left:10px;
        }
        .start-button{
            background-color: rgb(169, 10, 169);
            color:white;
            margin-top:20px;
            width:100px;
            height:30px;
            border:none;
            border-radius:4px;
        }
    </style>
    </head>
        <body>
            <button class="request-button">Request now</button>
            <button class="cart-button"><b>Add to cart</b></button>
            <button class="sign-button">Sign up</button>
            <br>
            <button class="start-button">Get started</button>
        </body>
</html>
